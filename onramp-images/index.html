    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Dynamic Onramp URL Logic ---
            const urlParams = new URLSearchParams(window.location.search);
            const onrampUrlFromQuery = urlParams.get('onramp_url');
            const onrampUrlFromData = document.body.dataset.onrampUrl;
            const location = urlParams.get('location');
            const emoji = urlParams.get('emoji');
            const showWorkshop = urlParams.get('show_workshop');

            const onrampUrl = onrampUrlFromQuery || onrampUrlFromData;
            const statusBox = document.getElementById('status-box');

            const mainTitle = document.getElementById('main-title');
            const selfLink = document.getElementById('self-link');
            const statusBoxSlide8 = document.getElementById('status-box-slide8');
            const qrcodeSlide8Container = document.getElementById('qrcode-slide8');
            const onrampUrlTextSlide8 = document.getElementById('onramp-url-text-slide8');

            if (onrampUrl) {
                // If a URL is found, update the status box to GREEN
                statusBox.style.backgroundColor = 'green';
                statusBox.innerHTML = `<a href="${onrampUrl}" target="_blank" style="color: white; text-decoration: underline;">Click here to claim your credits!</a>`;

                // Update slide 8 status box and generate QR code
                if (statusBoxSlide8) {
                    statusBoxSlide8.style.backgroundColor = 'green';
                    statusBoxSlide8.innerHTML = `<a href="${onrampUrl}" target="_blank" style="color: white; text-decoration: underline;">Click here to claim your credits!</a>`;
                }
                if (qrcodeSlide8Container) {
                    new QRCode(qrcodeSlide8Container, {
                        text: onrampUrl,
                        width: 256,
                        height: 256
                    });
                }
                if (onrampUrlTextSlide8) {
                    onrampUrlTextSlide8.href = onrampUrl;
                    onrampUrlTextSlide8.innerHTML = `<br>▶️ ${onrampUrl} ◀️`;
                }

            } else {
                // If no URL is found, set status box to RED
                statusBox.style.backgroundColor = 'red';
                statusBox.textContent = 'Credit Link: INACTIVE';

                // Update slide 8 status box with a more descriptive error
                if (statusBoxSlide8) {
                    statusBoxSlide8.style.backgroundColor = 'red';
                    statusBoxSlide8.textContent = 'ERROR: No credit link provided. Please reach out to a proctor or you won\'t be able to reclaim anything.';
                }
            }



            // Dynamically update the main title
            const displayEmoji = emoji || '👋';
            if (mainTitle) {
                mainTitle.innerHTML = `${displayEmoji} Welcome, developer!`;
            }

            // Update the self-referencing link
            if (selfLink) {
                selfLink.href = window.location.href;
            }

            // Add location and date info to slide 1
            const locationInfo = document.getElementById('location-info');
            const dateInfo = document.getElementById('date-info');

            if (locationInfo && location) {
                locationInfo.innerHTML = `🗺️ ${location}`;
            }

            if (dateInfo) {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = today.toLocaleString('en-GB', { month: 'long' });
                const year = today.getFullYear();
                dateInfo.innerHTML = `📅 ${day} ${month}, ${year}`;
            }

            // Generate self-link QR code on slide 1
            const qrcodeSelfLinkContainer = document.getElementById('qrcode-self-link');
            if (qrcodeSelfLinkContainer) {
                const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                qrcodeSelfLinkContainer.style.backgroundColor = isLocalhost ? 'gray' : '#4285F4';
                new QRCode(qrcodeSelfLinkContainer, {
                    text: window.location.href,
                    width: 256,
                    height: 256
                });
            }

            // Show workshop slides if requested
            if (showWorkshop === 'true') {
                const workshopSection = document.getElementById('riccardo-workshop');
                if (workshopSection) {
                    workshopSection.style.display = 'block';
                }
            }

            // --- Initialize Reveal.js ---
            Reveal.initialize({
                controls: true,
                progress: true,
                center: true,
                hash: false,
                history: false,
                slideNumber: true,
                plugins: [ RevealHighlight ]
            });
        });
