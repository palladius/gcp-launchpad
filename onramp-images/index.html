    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Dynamic Onramp URL Logic ---
            const urlParams = new URLSearchParams(window.location.search);
            const onrampUrlFromQuery = urlParams.get('onramp_url');
            const onrampUrlFromData = document.body.dataset.onrampUrl;
            const location = urlParams.get('location');
            const emoji = urlParams.get('emoji');

            const onrampUrl = onrampUrlFromQuery || onrampUrlFromData;
            const statusBox = document.getElementById('status-box');
            const locationPlaceholder = document.getElementById('location-placeholder');
            const emojiPlaceholder = document.getElementById('emoji-placeholder');
            const mainTitle = document.getElementById('main-title');
            const selfLink = document.getElementById('self-link');

            if (onrampUrl) {
                // If a URL is found, update the status box to GREEN
                statusBox.style.backgroundColor = 'green';
                statusBox.innerHTML = `Credit Link: ACTIVE - <a href="${onrampUrl}" target="_blank" style="color: white; text-decoration: underline;">Click here to claim your credits!</a>`;
            } else {
                // If no URL is found, set status box to RED
                statusBox.style.backgroundColor = 'red';
                statusBox.textContent = 'Credit Link: INACTIVE';
            }

            // Update location and emoji if they exist
            if (location) {
                locationPlaceholder.textContent = `| ${location}`;
            }
            if (emoji) {
                emojiPlaceholder.textContent = emoji;
            }

            // Dynamically update the main title if location and emoji are present
            if (location && emoji && mainTitle) {
                mainTitle.innerHTML = `${emoji} Welcome, ${location}!`
            }

            // Update the self-referencing link
            if (selfLink) {
                selfLink.href = window.location.href;
            }

            // --- Initialize Reveal.js ---
            Reveal.initialize({
                controls: true,
                progress: true,
                center: true,
                hash: false,
                history: false,
                plugins: [ RevealHighlight ]
            });
        });
    </script>
